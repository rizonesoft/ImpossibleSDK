name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tools: ~\AppData\Local\ImpossibleSDK
          - os: ubuntu-latest
            tools: ~/.cache/impossible-sdk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # test_site.py clones local history for stamped receipts and page freshness
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Python test dependencies
        run: python -m pip install --disable-pip-version-check "pillow==13.0.0"
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.tools }}
          key: tools-${{ matrix.os }}-${{ hashFiles('toolchain.json') }}
      - name: Install the pinned toolchain
        run: python tools/bootstrap.py
      - name: Cache pinned WinUI sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/impossible-sdk/winui
          key: winui-${{ hashFiles('tools/winui/pin.json') }}
      - name: Fetch pinned WinUI sparse checkout
        shell: bash
        run: |
          python - <<'EOF'
          import json, shutil, subprocess
          from pathlib import Path
          pin = json.loads(Path("tools/winui/pin.json").read_text(encoding="utf-8"))
          dst = Path.home() / ".cache/impossible-sdk/winui"
          head = None
          if (dst / ".git").exists():
              res = subprocess.run(["git", "-C", str(dst), "rev-parse", "HEAD"], capture_output=True, text=True)
              if res.returncode == 0:
                  head = res.stdout.strip()
          if head != pin["commit"]:
              if dst.exists():
                  shutil.rmtree(dst)
              dst.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "init", str(dst)], check=True)
              subprocess.run(["git", "-C", str(dst), "remote", "add", "origin", pin["repository"]], check=True)
              subprocess.run(["git", "-C", str(dst), "sparse-checkout", "init", "--cone"], check=True)
              subprocess.run(["git", "-C", str(dst), "sparse-checkout", "set", "controls/dev/CommonStyles", "dxaml/xcp/dxaml/themes"], check=True)
              subprocess.run(["git", "-C", str(dst), "fetch", "--filter=blob:none", "--depth", "1", "origin", pin["commit"]], check=True)
              subprocess.run(["git", "-C", str(dst), "checkout", pin["commit"]], check=True)
          EOF
      - name: Cache pinned WinUI NuGet package
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages/microsoft.windowsappsdk.winui
          key: winui-nuget-${{ hashFiles('reference/packages.lock.json') }}
      - name: Fetch pinned WinUI NuGet package
        shell: bash
        run: |
          python - <<'EOF'
          import hashlib, json, urllib.request, zipfile
          from pathlib import Path
          lock = json.loads(Path("reference/packages.lock.json").read_text(encoding="utf-8"))
          pkg = json.loads(Path("reference/package.json").read_text(encoding="utf-8"))
          deps = next(iter(lock["dependencies"].values()))
          info = deps["Microsoft.WindowsAppSDK.WinUI"]
          ver = info["resolved"]
          if ver != pkg["winui_component"]["version"]:
              raise SystemExit(f"WinUI version mismatch: lock={ver} != package.json={pkg['winui_component']['version']}")
          want_gx_sha256 = pkg["generic_xaml_sha256"]
          dst = Path.home() / ".nuget/packages/microsoft.windowsappsdk.winui" / ver
          dll = dst / "runtimes-framework/win-x64/native/Microsoft.ui.xaml.dll"
          gx = dst / "lib/native/Microsoft.UI/Themes/generic.xaml"
          if not (dll.is_file() and gx.is_file()):
              url = f"https://api.nuget.org/v3-flatcontainer/microsoft.windowsappsdk.winui/{ver}/microsoft.windowsappsdk.winui.{ver}.nupkg"
              dst.mkdir(parents=True, exist_ok=True)
              nupkg = dst / f"microsoft.windowsappsdk.winui.{ver}.nupkg"
              urllib.request.urlretrieve(url, nupkg)
              try:
                  with zipfile.ZipFile(nupkg) as zf:
                      for member in ("runtimes-framework/win-x64/native/Microsoft.ui.xaml.dll", "lib/native/Microsoft.UI/Themes/generic.xaml"):
                          zf.extract(member, dst)
              finally:
                  nupkg.unlink(missing_ok=True)
              got_gx_sha256 = hashlib.sha256(gx.read_bytes()).hexdigest()
              if got_gx_sha256 != want_gx_sha256:
                  gx.unlink(missing_ok=True)
                  dll.unlink(missing_ok=True)
                  raise SystemExit(f"generic.xaml sha256 mismatch: {got_gx_sha256} != {want_gx_sha256}")
          EOF
      - name: Build and test
        run: python tools/build.py
      - name: Work list
        run: |
          python scripts/todo-graph.py validate --all
          python scripts/todo-graph.py plan --check
