name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tools: ~\AppData\Local\ImpossibleSDK
          - os: ubuntu-latest
            tools: ~/.cache/impossible-sdk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.tools }}
          key: tools-${{ matrix.os }}-${{ hashFiles('toolchain.json') }}
      - name: Install the pinned toolchain
        run: python tools/bootstrap.py
      - name: Build and test
        run: python tools/build.py
      - name: Work list
        run: |
          python scripts/todo-graph.py validate --all
          python scripts/todo-graph.py plan --check
