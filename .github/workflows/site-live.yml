name: Live site

# Every six hours the published site is compared with a fresh build of main. A
# failed publish nobody saw, or an old copy that came back, is published again,
# and this run stays red as the report.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Wait for a publish that is under way
        shell: bash
        run: |
          for n in $(seq 60); do
            busy=$(gh run list --workflow pages.yml --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$busy" = 0 ] && exit 0
            sleep 30
          done
          echo "a publish has been under way for half an hour"; exit 1
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ImpossibleSDK
          key: tools-windows-latest-${{ hashFiles('toolchain.json') }}
      - name: Build main
        run: |
          python tools/build.py --no-test
          python tools/site/build.py --out _site --outward outward.txt
      - name: Compare, and publish again when it differs
        shell: bash
        run: |
          python tools/site/live.py same _site --wait 120 && exit 0
          newest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          busy=$(gh run list --workflow pages.yml --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$newest" != "$(git rev-parse HEAD)" ] || [ "$busy" != 0 ]; then
            echo "main moved on meanwhile: its own publish compares itself"; exit 0
          fi
          gh workflow run pages.yml --ref main
          exit 1
      - name: Links that leave the site
        if: always() && hashFiles('outward.txt') != ''
        run: python tools/site/live.py links outward.txt
